[project]
name = "ragbench"
version = "0.1.0"
description = "Choosing embedding and reranking models for German retrieval: quality, licence, cost and speed on a CPU"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The word lists read better as one string each.
"ragbench/language.py" = ["SIM905"]
